[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clipper"
version = "0.1.0"
description = "Transforme des vidéos YouTube longues en clips de 2 à 5 minutes, prêts à publier."
requires-python = ">=3.10"
dependencies = [
    "yt-dlp>=2025.1.0",
    "anthropic>=2.12.0",
    "requests>=2.31",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
clipper = "clipper.cli:main"

[tool.setuptools.packages.find]
include = ["clipper*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
